<!doctype html>
<html lang="ja" translate="no">
<head>
  <meta charset="utf-8">
  <meta name="google" content="notranslate">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <title>BUSSAP — 札幌のバス時刻</title>
  <link rel="stylesheet" href="/vendor/leaflet.css">
  <link rel="stylesheet" href="/styles.css">
  <link rel="stylesheet" href="/map.css">
  <script src="/vendor/leaflet.js" defer></script>
  <script src="/map.js" defer></script>
  <script src="/app.js" defer></script>
</head>
<body>
  <main class="app">
    <header class="masthead"><h1>BUSSAP</h1><span>札幌のバス時刻</span></header>
    <section class="search-section" aria-label="バス停検索">
      <label class="search-box" for="stop-search">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.8" cy="10.8" r="6.6"/><path d="m16 16 5 5"/></svg>
        <input id="stop-search" type="search" placeholder="バス停を検索" autocomplete="off" enterkeyhint="search">
      </label>
      <div class="operator-tabs" role="group" aria-label="バス会社">
        <button type="button" class="active" data-operator="all" aria-pressed="true">すべて</button>
        <button type="button" data-operator="chuo" aria-pressed="false">中央</button>
        <button type="button" data-operator="jr" aria-pressed="false">JR</button>
        <button type="button" data-operator="jotetsu" aria-pressed="false">じょうてつ</button>
      </div>
    </section>

    <section id="map-panel" class="map-panel" aria-label="バス停マップ">
      <div class="map-frame">
        <div id="map" role="application" aria-label="札幌のバス停地図"></div>
        <button id="locate-button" class="locate-button" type="button" aria-label="現在地を表示">◎</button>
        <div id="map-status" class="map-status" hidden></div>
      </div>
      <div id="map-sheet" class="map-sheet" hidden aria-live="polite">
        <div class="sheet-handle" aria-hidden="true"></div>
        <div id="sheet-content"></div>
      </div>
      <p class="map-source">停留所位置: HODA GTFS / 札幌市えきバス。JRの番号なし地点は代表位置です。<a href="/network-map" target="_blank" rel="opener">参考路線図 (2016年・PDF) ↗</a> · <a href="https://bus-routes.net/" target="_blank" rel="noopener noreferrer">全国の路線を見る ↗</a></p>
    </section>

    <section id="search-panel" class="panel" hidden aria-live="polite">
      <div class="intro"><span class="eyebrow">BUS STOP</span><h2>バス停を探す</h2><p>バス停名を入力して、乗る場所を選んでください。</p></div>
      <div id="search-status" class="status" hidden></div>
      <div id="search-results" class="result-list"></div>
    </section>

    <section id="pattern-panel" class="panel" hidden aria-live="polite">
      <div class="section-head"><div><span class="eyebrow">JR HOKKAIDO BUS</span><h2 id="pattern-title"></h2><p>路線と行先を選んでください。</p></div><button class="text-button" type="button" id="pattern-back">地図に戻る ›</button></div>
      <div id="pattern-status" class="status" hidden></div>
      <div id="pattern-results" class="result-list"></div>
    </section>

    <section id="departure-panel" class="panel" hidden aria-live="polite">
      <div class="section-head stop-head"><div><span class="eyebrow">BOARDING STOP</span><h2 id="selected-stop"></h2><p id="selected-detail"></p></div><button class="text-button" type="button" id="change-stop">地図に戻る ›</button></div>
      <div class="date-bar">
        <button type="button" id="today-button" class="date-button active">今日</button>
        <button type="button" id="tomorrow-button" class="date-button">明日</button>
        <label class="calendar-button" id="calendar-button" for="date-input" aria-label="日付を選ぶ"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M7 2v6M17 2v6M3 10h18"/></svg><span class="sr-only">日付を選ぶ</span></label>
        <input type="date" id="date-input" aria-label="日付を選ぶ">
      </div>
      <div class="departures-heading"><div><span class="eyebrow" id="date-label"></span><h3>次のバス</h3></div><button type="button" class="refresh-button" id="refresh-button" aria-label="時刻を更新">↻ <span>更新</span></button></div>
      <div id="departure-status" class="status" hidden></div>
      <div id="departure-results" class="departure-list"></div>
      <div id="source-note" class="source-note"></div>
    </section>
  </main>
</body>
</html>
